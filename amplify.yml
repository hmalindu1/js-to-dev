version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro 7 needs Node >= 22.23.4; Amplify's default Node 22 image is older
        - nvm install 22
        - nvm use 22
        - node --version
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
